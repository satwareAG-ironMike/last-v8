<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cross-plane V8 - Satware Test Cell</title>
    <link
      rel="icon"
      href='data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16"><rect width="16" height="16" fill="%230b0d10"/><circle cx="8" cy="8" r="5" fill="none" stroke="%23e8b12a" stroke-width="2"/><circle cx="8" cy="8" r="1.6" fill="%23e8b12a"/></svg>'
    />
    <script type="importmap">
      {
        "imports": {
          "three": "/node_modules/three/build/three.module.js",
          "three/addons/": "/node_modules/three/examples/jsm/",
          "three/examples/jsm/": "/node_modules/three/examples/jsm/"
        }
      }
    </script>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b0d10;
        overflow: hidden;
        font-family: "DejaVu Sans Mono", ui-monospace, monospace;
      }
      #viewport,
      #viewport canvas {
        position: fixed;
        inset: 0;
        display: block;
      }
      #hud {
        position: fixed;
        top: 14px;
        left: 16px;
        color: #cfd6de;
        font-size: 12px;
        line-height: 1.5;
        letter-spacing: 0.06em;
        pointer-events: none;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
      }
      #hud strong {
        color: #e8b12a;
        font-size: 13px;
      }
      #hud span {
        display: block;
      }
      #status {
        color: #8fa8bf;
      }
    </style>
  </head>
  <body>
    <div id="viewport"></div>
    <div id="hud">
      <strong>SATWARE TEST CELL</strong>
      <span>CROSS-PLANE V8 - 90 DEG DOHC - MULE 01</span>
      <span id="status">booting...</span>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
